name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: portfolio-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: portfolio-${{ github.run_attempt }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "Artifact metadata did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: portfolio-${{ github.run_attempt }}
